services:
  - type: web
    name: crows
    # Public always-on process: keeps its Spectrum websocket open and serves
    # the console's bridge poll at the public URL. Render injects PORT; crow
    # listens on it via the host-agnostic bridge (CROWS_BRIDGE_TOKEN protects
    # /status).
    plan: starter
    runtime: node
    port: 8790
    buildCommand: npm install
    startCommand: npm start
    disk:
      name: crows-data
      mountPath: /data
      sizeGB: 1
    healthCheckPath: /health
    envVars:
      - key: CROWS_STORE
        value: /data/crows.json
      - key: BASE_RPC_URL
        value: https://mainnet.base.org
      - key: CROWS_BRIDGE_TOKEN
        sync: false
      - key: PROJECT_ID
        sync: false
      - key: PROJECT_SECRET
        sync: false
      - key: X_BEARER_TOKEN
        sync: false
      - key: OPERATOR_PHONE
        sync: false
      - key: LLM_API_KEY
        sync: false